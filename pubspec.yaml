name: scannerapp
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.11.1
  logger: ^2.8.0
  internet_connection_checker_plus: ^3.1.2
  permission_handler: ^12.0.3
  elegant_notification: ^2.5.1
  provider: ^6.1.5+1
  speech_to_text: 7.3.0
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/companies/
    - assets/fonts/manrope/OFL.txt

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Variable.ttf

